vaxia_governance.proposal_settings:
  path: '/admin/rpg/proposal'
  defaults:
    _form: '\Drupal\vaxia_governance\Form\ProposalSettingsForm'
    _title: 'Proposal system'
  requirements:
    _permission: 'administer proposal'
vaxia_governance.proposals:
  path: '/proposals'
  defaults:
    _controller: '\Drupal\vaxia_governance\Controller\ProposalList::page'
    _title: 'Proposals'
  requirements:
    _role: 'player'
vaxia_governance.ballot:
  path: '/node/{node}/webform/components'
  defaults:
    _form: '\Drupal\vaxia_governance\Form\BallotForm'
    _title: 'Ballot'
  requirements:
    _custom_access: '\Drupal\vaxia_governance\Controller\WebformTabs::ballotAccess'
  options:
    parameters:
      node:
        type: entity:node
vaxia_governance.ballot_tab:
  path: '/node/{node}/webform'
  defaults:
    _form: '\Drupal\vaxia_governance\Form\BallotForm'
    _title: 'Ballot'
  requirements:
    _custom_access: '\Drupal\vaxia_governance\Controller\WebformTabs::ballotAccess'
  options:
    parameters:
      node:
        type: entity:node
vaxia_governance.webform_results:
