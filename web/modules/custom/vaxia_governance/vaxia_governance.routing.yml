  defaults:
    _controller: '\Drupal\vaxia_governance\Controller\WebformTabs::results'
    _title: 'Results'
  requirements:
    _custom_access: '\Drupal\vaxia_governance\Controller\WebformTabs::resultsAccess'
  options:
    parameters:
      node:
        type: entity:node
vaxia_governance.webform_configure:
