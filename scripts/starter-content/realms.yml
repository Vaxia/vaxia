  - name: 'Science Fiction'
    world: 'The Meridian Reach'
    description: 'Starships, stations and the edge of known space: the Meridian Reach.'
    setting: |
      [b]The Meridian Reach[/b] is the frontier: a string of colonies, mining stations and jump gates at the edge of settled space. The Core worlds are a month away; out here, the corporations make the rules and the crews break them.

      [b]Tone:[/b] space opera with grease under its fingernails. Ships break, contracts go bad, and there are things past the last gate nobody understands.

      [b]Places[/b]
      [list]
      [*][b]Port Kessler[/b], an orbital station and free port, where every crew in the Reach stops to refuel.
      [*][b]The Meridian[/b], a battered long-haul freighter looking for crew.
      [*][b]The Icarus[/b], a research vessel found drifting, its crew gone.
      [/list]

      [b]Powers that be[/b]
      [list]
      [*][b]Halvorsen-Tak[/b]: the mining corporation that owns half the Reach.
      [*][b]The Gate Authority[/b]: keeps the jump gates running, and decides who uses them.
      [*][b]The Drift[/b]: free traders, smugglers and everyone the other two can't control.
      [/list]

      [b]Story hooks:[/b] a salvage claim on the Icarus, an android asking for asylum, a gate that opened somewhere new, a cargo that is ticking.
    skills:
      - [Piloting, 'Flying anything from a shuttle to a freighter.', [move, operate, predict]]
      - [Hacking, 'Getting into systems that would rather you didn''t.', [bypass, discover, change nature]]
      - [Starship Engineering, 'Keeping drives, reactors and life support running.', [repair, operate, know]]
      - [Firearms, 'Pistols, rifles and anything else that shoots.', [damage, avoid, predict]]
      - [Xenobiology, 'Alien life: what it is, what it eats, what it wants.', [know, discover, predict]]
      - [Zero-G Maneuvering, 'Moving and fighting without gravity.', [move, endure, avoid]]
      - [Medicine, 'Trauma care, surgery and keeping crew alive.', [repair, know, discover]]
      - [Negotiation, 'Contracts, deals and talking your way past port security.', [convince, predict, know]]
      - [Demolitions, 'Breaching charges and things that should go boom.', [damage, bypass, craft]]
      - [Navigation, 'Plotting jumps and courses through the Reach.', [predict, operate, know]]
    suggestions:
      - 'there is a broken coffee machine'
      - 'there is a maintenance drone that keeps following people'
      - 'there is a power cut on one deck'
      - 'there is a vendor selling hydroponic strawberries, very expensive'
      - 'there is a stray ship''s cat with an access badge'
    rooms:
      - name: 'Port Kessler Promenade'
        description: 'The free port''s main ring: neon noodle stalls, salvage brokers, a dockside bar, and a view of every ship in the Reach. Jobs, gossip and trouble are all for sale.'
      - name: 'Bridge of the Meridian'
        description: 'A freighter''s cramped bridge: a cracked viewscreen, three crash couches and a navigation computer with opinions. Home, if you can keep her flying.'
      - name: 'The Derelict Icarus'
        description: 'A research vessel found adrift past the last gate. Power flickers, the logs end mid-sentence, and the airlocks were opened from the inside.'
    items:
      - name: 'Coil Pistol'
        type: Weapon
        class: 'Light (15% / -10)'
        sub_type: Pistol
        description: 'A compact magnetic sidearm, standard issue across the Reach.'
        bonuses: {dexterity: 1}
      - name: 'Ballistic Flight Vest'
        type: Armor/Shield
        description: 'Layered ballistic weave under a pilot''s vest.'
        absorbs: 2
        absorb_type: armor
      - name: 'Med-Injector'
        type: 'Charged Item'
        description: 'Auto-injector of nanite coagulant. Three charges.'
        pp: 10
        use: once
        uses: 3
      - name: 'Maintenance Drone'
        type: Companion/Drone
        description: 'A fist-sized repair drone that follows its owner and fixes what it can reach.'
        build_points: 20
    npcs:
