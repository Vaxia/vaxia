  - name: Horror
    world: 'Hollow Creek'
    description: 'A small town with a long memory: the dark corners of Hollow Creek.'
    setting: |
      [b]Hollow Creek[/b] is a mill town in the hills, cut off by the river and a single bridge. It looks ordinary by day. By night, the old families keep their curtains drawn, and the people who ask questions tend to leave town suddenly.

      [b]Tone:[/b] dread and mystery. Characters are ordinary people up against things they don't understand; knowledge costs, and not everyone makes it to morning.

      [b]Places[/b]
      [list]
      [*][b]The Last Light Diner[/b], open all night, where the town's few honest people meet.
      [*][b]Blackwood Asylum[/b], closed for forty years and never quite empty.
      [*][b]Ravensworth Manor[/b], home of the town's oldest family, who never seem to age.
      [/list]

      [b]Powers that be[/b]
      [list]
      [*][b]The Ravensworths[/b]: old money, old secrets, and a great deal of influence.
      [*][b]The Lodge[/b]: a fraternal order that meets on the new moon.
      [*][b]The Night Watch[/b]: a handful of townsfolk who know the truth and try to keep people safe.
      [/list]

      [b]Story hooks:[/b] a missing hiker, a radio station that broadcasts only at 3 a.m., a will that leaves Ravensworth Manor to a stranger, lights in the asylum's windows.
    skills:
      - [Occult Lore, 'What the old books say about things that should not exist.', [know, discover, predict]]
      - [Investigation, 'Finding what people hid: records, clues, lies.', [discover, know, persist]]
      - [Firearms, 'Shotguns and revolvers, for when talking fails.', [damage, avoid, predict]]
      - [Persuasion, 'Getting frightened people to talk.', [convince, bolster, predict]]
      - [First Aid, 'Keeping people alive until help arrives.', [repair, bolster, endure]]
      - [Sixth Sense, 'A feeling when something is wrong.', [predict, discover, avoid]]
      - [Stealth, 'Not being seen, or heard, or found.', [conceal, move, avoid]]
      - [Driving, 'Old trucks on bad roads, at night, in a hurry.', [move, operate, avoid]]
      - [Research, 'Libraries, archives, newspapers and old letters.', [discover, know, persist]]
      - [Rites of Warding, 'Salt lines, sigils and prayers that keep things out.', [weaken, bolster, persist]]
    suggestions:
      - 'there is a jukebox playing a song nobody chose'
      - 'there is a stranger asking for directions to a road that closed years ago'
      - 'there is a power flicker and a long, quiet minute'
      - 'there is a lost dog that won''t go near the woods'
      - 'there is a church bake sale with suspiciously good pie'
    rooms:
      - name: 'The Last Light Diner'
        description: 'Chrome, cracked vinyl booths and bottomless coffee. The only place in Hollow Creek open past midnight, and the waitress knows which regulars stopped coming in.'
      - name: 'Blackwood Asylum'
        description: 'Closed forty years ago after a fire nobody talks about. The doors are chained from the inside, the patient files are still in the cabinets, and the night nurse''s bell still rings.'
      - name: 'Ravensworth Manor'
        description: 'A gothic house on the hill above town. Portraits whose eyes follow you, locked wings, and a family dinner you may not leave until it is finished.'
    items:
      - name: 'Silvered Revolver'
        type: Weapon
        class: 'Light (15% / -10)'
        sub_type: Pistol
        description: 'An old six-shooter, its cylinder etched with protective sigils. Takes silver rounds.'
        bonuses: {dexterity: 1}
      - name: 'Holy Water'
