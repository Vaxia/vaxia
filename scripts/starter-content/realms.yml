# Example realms for a new VAXIA site, read by scripts/starter-content.php.
# One administrative realm (storyhosting and the system pages, not played in)
# and three playable example realms, each with a setting page, a skills page,
# three rooms, shop items, an example character (an open NPC storyhosts
# can play) and stock NPCs (open, generic NPCs: guards, bartenders and the
# like). Each realm's skills are also its "Common skills" on the character
# form (the Skill presets vocabulary): [name, description, three aspects]. Edit freely before running the script, or edit the content on
# the site afterwards.

admin_realm:
  name: Storyhost
  description: 'Storyhosting, the game system and site business. Not a place characters play.'

realms:

  - name: Fantasy
    world: Eldmoor
    description: 'Swords, sorcery and old roads: the kingdoms of Eldmoor.'
    setting: |
      [b]Eldmoor[/b] is a land of walled towns and wild places between them. The old empire fell three hundred years ago; its roads, ruins and half-remembered magic are still everywhere.

      [b]Tone:[/b] classic adventure. Heroes are capable, the world is dangerous, and there is always another road.

      [b]Places[/b]
      [list]
      [*][b]Thornwick[/b], a market town at the edge of the Whispering Wood, where most adventures start.
      [*][b]The Whispering Wood[/b], an old forest the fae still claim.
      [*][b]Castle Greymoor[/b], a ruined fortress said to hold the last emperor's vault.
      [/list]

      [b]Powers that be[/b]
      [list]
      [*][b]The Lantern Guild[/b]: licensed mages, who keep magic safe (and expensive).
      [*][b]The Wardens[/b]: rangers who keep the roads open.
      [*][b]The Ashen Court[/b]: nobles who want the empire back, with themselves in charge.
      [/list]

      [b]Story hooks:[/b] a map to Greymoor's vault, a fae bargain gone wrong, a caravan that never arrived, a dragon sighted for the first time in a century.
    skills:
      - [Swordplay, 'Fighting with blades of any size.', [damage, avoid, move]]
      - [Archery, 'Bows and crossbows, from hunting to war.', [damage, avoid, discover]]
      - [Hedge Magic, 'Small, practical spells: light, mending, warding.', [summon, repair, bolster]]
      - [Woodcraft, 'Living off the land: tracking, foraging, shelter.', [discover, endure, conceal]]
      - [Courtly Manners, 'Moving among nobles without making enemies.', [convince, know, predict]]
      - [Alchemy, 'Brewing potions, salves and the occasional explosion.', [craft, change nature, know]]
      - [Horsemanship, 'Riding, and fighting from the saddle.', [move, operate, endure]]
      - [Lockpicking, 'Locks, traps and other people''s doors.', [bypass, operate, discover]]
      - [Herbalism, 'Healing herbs, poultices and which plants to avoid.', [repair, know, discover]]
      - [Brawling, 'Fists, elbows and tavern furniture.', [damage, avoid, endure]]
    suggestions:
      - 'there is a minstrel who only knows one song'
      - 'there is a lost goat wearing a noble''s signet ring'
      - 'there is a notice offering a reward for a missing cat'
      - 'there is a traveling merchant selling "genuine dragon scales"'
      - 'there is a puddle that reflects a different sky'
    rooms:
      - name: 'The Prancing Stag'
        description: 'A crowded tavern in Thornwick: a roaring hearth, a notice board full of jobs, and a barkeep who hears everything. Where parties form and rumours start.'
      - name: 'The Whispering Wood'
        description: 'Ancient trees, paths that move when no one is looking, and lights between the trunks at night. The fae keep their bargains, to the letter.'
      - name: 'Ruins of Castle Greymoor'
        description: 'A broken fortress on a hill above the marsh. Its halls are fallen, its cellars are not, and something below still guards the emperor''s vault.'
    items:
      - name: 'Ranger''s Longbow'
        type: Weapon
        class: 'Medium (45% / 0)'
        sub_type: Bow
        description: 'Yew, horn and linen string. Accurate past a hundred paces.'
        bonuses: {dexterity: 1}
      - name: 'Steel Longsword'
        type: Weapon
        class: 'Medium (45% / 0)'
        sub_type: 'Long blade'
        description: 'A plain, well-balanced blade from a Thornwick smith.'
        bonuses: {strength: 1}
      - name: 'Leather Brigandine'
        type: Armor/Shield
        description: 'Riveted leather over steel plates. Quiet enough for the woods.'
        absorbs: 2
        absorb_type: armor
      - name: 'Healing Draught'
        type: 'Charged Item'
        description: 'A bitter green tonic that closes wounds. Three doses.'
        pp: 10
        use: once
        uses: 3
    # Stock NPCs: open, generic NPCs any storyhost may play as stand-ins for
    # common encounters, named for their role ("Generic ...", as the original
    # site named them). Short notes, no age or sex; stats and skills in fives.
    npcs:
      - name: 'Generic Town Guard'
        species: [field_fantasy_species, human]
        languages: [field_fantasy_languages, [common_nat]]
        description: 'Helm, tabard, spear and a tired stare.'
        personality: 'By the book; can be talked down, not bribed.'
        stats: {life: 30, endurance: 30, strength: 30, dexterity: 25, intelligence: 20, spirituality: 20, charisma: 20}
        skills:
          - [Spear and Shield, 35, 'Watch drill: hold the line.', [damage, avoid, endure]]
          - [Watchfulness, 25, 'Spots trouble before it starts.', [discover, predict, know]]
