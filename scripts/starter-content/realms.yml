        skills:
          - [Serving, 30, 'Through a crowd without spilling a drop.', [move, avoid, predict]]
          - [Gossip, 30, 'Hears what the barkeep misses.', [discover, convince, know]]
      - name: 'Generic Shopkeeper'
        species: [field_fantasy_species, gnome]
        languages: [field_fantasy_languages, [common_nat, dwarvish_knw]]
        description: 'Spectacles, inky apron, a shop full of odds and ends.'
        personality: 'Haggles for sport; a story for every item.'
        stats: {life: 20, endurance: 20, strength: 15, dexterity: 20, intelligence: 30, spirituality: 25, charisma: 30}
        skills:
          - [Haggling, 35, 'Never loses a bargain she wants to win.', [convince, predict, know]]
          - [Appraisal, 30, 'Knows a fake from across the room.', [know, discover, predict]]
      - name: 'Generic Bandit'
        species: [field_fantasy_species, human]
        languages: [field_fantasy_languages, [common_nat]]
        description: 'Patched cloak, masked face, rusty blade.'
        personality: 'More bluster than bravery; runs when it turns.'
        stats: {life: 25, endurance: 25, strength: 25, dexterity: 25, intelligence: 20, spirituality: 20, charisma: 20}
        skills:
          - [Swordplay, 30, 'Rough, dirty blade work.', [damage, avoid, move]]
          - [Ambush, 25, 'Waits in the hedges for easy marks.', [conceal, move, predict]]
      - name: 'Generic Hedge Witch'
        species: [field_fantasy_species, human]
        languages: [field_fantasy_languages, [common_nat, sylvan_knw]]
        description: 'Barefoot, hung with charms, smelling of herbs.'
        personality: 'Kind to the sick, sharp with fools.'
        stats: {life: 20, endurance: 20, strength: 15, dexterity: 20, intelligence: 30, spirituality: 35, charisma: 20}
        skills:
          - [Herbalism, 35, 'A cure for most things.', [repair, know, discover]]
          - [Hedge Magic, 30, 'Charms, wards and small blessings.', [summon, repair, bolster]]
    character:
      name: Wren
      last_name: Ashdown
      titles: Warden
      species: [field_fantasy_species, halfling]
      languages: [field_fantasy_languages, [common_nat, sylvan_knw]]
      sex: Female
      age: 34
      occupation: 'Warden of the Thornwick road'
      description: 'Small, sun-browned and very quiet. A green cloak, a longbow taller than she is, and eyes that never stop moving.'
      background: 'Grew up on a farm the Whispering Wood swallowed in a single night. Joined the Wardens to learn why; still asking.'
      personality: 'Patient, dry-humoured, protective of travellers and suspicious of anyone who wants to go into the Wood on purpose.'
      stats: {life: 20, endurance: 25, strength: 25, dexterity: 32, intelligence: 22, spirituality: 20, charisma: 19}
      skills:
        - [Archery, 32, 'Longbow, fast and accurate at range.', [damage, avoid, discover]]
        - [Tracking, 28, 'Reads trails, signs and broken twigs.', [discover, know, predict]]
        - [Woodcraft, 25, 'Lives off the land; finds shelter anywhere.', [discover, endure, conceal]]
        - [Swordplay, 22, 'Short blade work when the bow is no use.', [damage, avoid, move]]
        - [Stealth, 30, 'Moves unseen through brush and town alike.', [conceal, move, avoid]]
