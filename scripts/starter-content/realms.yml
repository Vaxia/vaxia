      - name: 'Generic Barkeep'
        species: [field_fantasy_species, dwarf]
        languages: [field_fantasy_languages, [common_nat, dwarvish_nat]]
        description: 'Polishes a mug and hears everything.'
        personality: 'Gruff, fair; sells rumours for a drink.'
        stats: {life: 30, endurance: 30, strength: 25, dexterity: 20, intelligence: 25, spirituality: 20, charisma: 25}
        skills:
          - [Rumourmongering, 35, 'Knows who said what, and what it is worth.', [know, discover, convince]]
          - [Brawling, 25, 'Ends fights with the cudgel under the bar.', [damage, avoid, endure]]
      - name: 'Generic Tavern Server'
        species: [field_fantasy_species, halfling]
        languages: [field_fantasy_languages, [common_nat]]
        description: 'Quick feet, full tray, pencil behind an ear.'
        personality: 'Cheerful, nosy, remembers every face.'
