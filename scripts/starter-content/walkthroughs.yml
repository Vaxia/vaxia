      type: multichoice
      title: 'Social walkthrough - Gamer types'
      body: |-
        Robin D. Laws is a game designer and writer who wrote a book called “Robin's Laws of Good Gamemastering”. We can’t recommend this book nearly enough if you’re interested in sharpening your skills as a player and a game designer or game master. It’s mostly common sense advice. But one of the most valuable tools in Laws’s book is the “gamer types”.

        [b]The Power Gamer:[/b] Get more powers and use them often and efficiently.
        [b]The Butt-Kicker:[/b] Enjoys combat and pwning NPCs!
        [b]The Tactician:[/b] Likes to beat complex situations through thought and planning.
        [b]The Specialist:[/b] The one who always plays a "insert character type". Ninjas and Dritzz clones are popular.
        [b]The Method Actor:[/b] Likes total immersion in a character’s assumed persona, whatever the costs!
        [b]The Storyteller:[/b] Enjoys exploring a story unfold around a character’s actions and choices.
        [b]The Casual Gamer:[/b] Shows up to be with friends and share the social energies of the group.

        More information on Robin’s gamer types and the traits people come to a table for <a href="http://www.critical-hits.com/blog/2008/01/23/robins-laws-revisited-part-2-player-types-and-traits/" target="_blank">can be found online</a>.

        Most players are a combination of types! So it can be handy to know roughly where you fit. It helps you identify what sort of characters and sessions you’re looking for. If you’re playing with another player and not getting along, make sure you’re on the same page - the other player may be looking for more of a storyteller scene while you’re looking for a way to blow some steam off after a rough day. Try to find common ground.

