      type: multichoice
      title: 'System walkthrough - Winsby and Points Produced'
      body: |-
        Once you know what roll you need to succeed, then you need to know how well you succeeded. Did you succeed by the skin or your teeth, or did you make it look easy? Points produced (or PP) is how we tell that. The more PP you have, then better you did.

        Winsby is the difference between what you needed to roll - determined by the Ladder - and what you actually got. If you needed a 23 and rolled a 33, then your winsby is a 10, as in “Dareth wins by 10.” If you needed a 45 and rolled a 34, then you failed and the winsby (also called a failsby) is a -11. 

        Your winsby determines how many points you produced. Points are calculated as a percentage of your might, based on the winsby. If your winsby was a 10, then 10% of your might is your points. If your winsby was a 99, then 99% of your might is your points produced.

        This means having a high might often matters as much, and sometimes more, than the roll itself. While you don’t need a skill to attempt a roll (since you can always default to the relevant stat), having a skill will improve your might and helps you produce more points.

        The number of points produced on a roll is limited by the might the character has. For example: rolling a 99 on a might of 10 at most can produce 10 points. Rolling a 99 on a might of 60 could get up to 60 points produced.

        Points are used to determine how much damage was dealt, hit points healed or the strength of a bonus.

        [b]Question:[/b]

        If your might was a 65, and you needed a 25 to succeed and rolled a 47 - then what was your winsby and points produced?
