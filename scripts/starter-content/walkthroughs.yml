      type: multichoice
      title: 'Social walkthrough - How to apologize'
      body: |-
        Apologizing is hard! It really is! But a good apology really can heal many things. The thing is, if you need to apologize it's important to actually mean it. And, truthfully, not many of us have been taught how to make a good one and mean it. Here's how to properly apologize:

        There are four parts:

        "I’m sorry for…" - be specific, so the person you're apologizing to knows that you know what it is that you're apologizing for. If you can't be specific about the offense, then the 'apology' is vague - it doesn't mean much at all.

        "This is wrong because…" - this one may take some thought but that's the point. You need to be able to say how what you did hurt another person. 'I'm sorry you're upset' doesn't cut it. This is when you show the other person that you understand what was wrong about your actions.

        "In the future, I will…" - apologies mean nothing if you turn around the next day and do it again! That's not being sorry, that's just trying to smooth things over long enough to do it again. State what you will do in the future, not what you won't - that way you have a goal in mind.

        "Will you forgive me?" - this is the offer to fix your friendship. The other person is not obliged to accept! (Nor are you should you be the one being apologized to.) Sometimes they just aren't interested in forgiveness, but if you've gone through all four steps then you've made a good effort at it.

        Each of these serves a very important purpose, so you've got to hit all of them on the way. And yes, it's an awkward, uncomfortable, and potentially humiliating thing to do. But if you genuinely owe someone an apology - then you've hurt them. Don't you think a little bit of discomfort in return is called for?

        [b]Question:[/b]
        Which of these apologies count as a 'real' one? (check all that apply)
