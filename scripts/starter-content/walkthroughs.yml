    -
      type: multichoice
      title: 'System walkthrough - Skills'
      body: |-
        If stats describe your character’s basic abilities, then skills describe what your character knows how to do. Skills reflect any training or specific knowledge your character has and allow them to do more complicated things. A skill may grant the character the ability to cast magic spells, swing a sword, or pick a lock.

        What makes our system unique is that you are responsible for writing your own skills!

        This means they can be very flexible and customized to your character’s history and personality. Every skill can be written differently. They may come from a different background and have a different focus or flavor. <a href="/wiki/skills-and-aspects" target="_blank">See the skill guide in the wiki for more information.</a>

        Skills are only needed for actions that are out of the ordinary. A character can easily walk and talk at the same time, can cook a decent enough meal to feed themselves, read, or ride a horse down a road without needing a specific skill. Acrobatically leaping from roof to roof, running the kitchen of a four star restaurant, eavesdropping on a whispered conversation two tables away, or riding a horse into combat call for a skill.

        Even if you don’t need a skill to perform the action, having the skill can make it easier to succeed at.

        You can spend XP to improve skills. It costs the current value in the skill / 10 (rounded down) times 0.75 to raise these stats. For example: a skill at 23 costs 1.5 XP to raise.

        [b]Question:[/b]

        What actions would require a skill to perform well? Check all that apply.
      max_score: 4
      multi: true
