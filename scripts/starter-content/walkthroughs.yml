      type: multichoice
      title: 'Magic is a two-trait ruling using Intelligence ...'
      body: |-
        Magic is a two-trait ruling using Intelligence and Spirituality as the stat plus a “magical” skill.

        For our purposes, a magical action is anything that defies the normal laws of physics, like conjuring flame out of nowhere or teleporting to a different place. This includes abilities that are psionic, divine, chi-based, or arcane - they all operate under the same magic ruling when it comes time to rolling dice.  The type of magic is only flavor. 

        Difficulty for casting magic is based on the complexity of the effect. Most useful spell effects start around difficulty 25. A larger, more powerful, or longer-lasting version of an effect is just a matter of more PP, not a higher difficulty to cast against. You can make it easier to generate more PP by ‘charging’ the round before to decrease the difficulty of the spell on the next round, or by casting the spell over two rounds and adding the PP generated together.

        You can do this with any skill really, though it is most commonly used with magic and item creation.

        While you don’t need a specific magic skill to cast a spell, it helps a lot, so in general you want to stick to the skill you have described for magic. The most minor of spells, ‘cantrips’ may be cast by even the weakest of mage or non-mage on a good enough roll. But there may not be much PP behind it though for an unskilled caster since the might is so low.

        [b]Question:[/b]

        If you cast a fireball with a difficulty of 25, and want to make it bigger what do you need to do? Check all that apply.
      max_score: 4
