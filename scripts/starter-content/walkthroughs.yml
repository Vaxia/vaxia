      type: multichoice
      title: 'System walkthrough - Might'
      body: |-
        When you hear “might” here, we’re talking about the combined value of your Stat and a relevant Skill. The combination of stats and skills rolled is different for different situations. For example, a skill like "First Aid" could be rolled with Dexterity to perform first aid, or Intelligence to figure out what's wrong with a patient before you work on him. Or even Awareness to spot the clue that someone is about to choke on a piece of chicken before they do.

        If there are any questions which stat to use in a specific situation you can always ask your nearest A/SH.

        Here, a 25 is considered to be ‘average’. A stat of 25 here is equivalent to a 10 in D&D. Likewise a 25 skill is considered to be an average professional at the skill. For example: The average village blacksmith may have a 25 Strength and a 25 Skill, giving him a 50 might.

        If you don’t have a skill that fits the roll, then your might is simply the stat being used. You can always default to the stat.

        [b]Question:[/b]

        If your Intelligence is a 32 and your Awareness a 27, and you have a skill at 34, then what is your might when the skill is used with Intelligence? What is it if used with Awareness?
