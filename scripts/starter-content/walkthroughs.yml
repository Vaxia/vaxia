      type: multichoice
      title: 'Social walkthrough - Types of RP'
      body: |-
        There are two types of RP on the site, casual and session.

        Session RP is when one of our A/SHs plans and runs a scenario for one or more players on the site. Sessions are our version of ‘an adventure’, or even a ‘campaign’ in the case of sagas. In sessions you get the extra challenge and risk of the situation the A/SH has put together for you - but you can also reap plenty of rewards: Silver, extra XP, and items.

        Casual RP is when you and another player (or half a dozen) decide to take over a room and just have fun! Casual RP can be a lot of fun and it builds the social connections between all of your characters. It also helps you unlock any banked XP you’ve gotten from sessions - so if someone’s in Limbo asking for RP and you’ve an evening free: Take them up on it.

        Since session RP can only be unlocked with roleplaying posts - to get all the XP your character's are entitled to you want to do both casual and session RP.

