      type: multichoice
      title: 'System walkthrough - Types of Rolls'
      body: |-
        There are two types of rulings in our system.

        The most common sort of ruling you’ll see outside of combat is a “one-trait ruling”. For example: this is the type of ruling meant when we ask for an “Awareness check”. The one-trait ruling is one might with one percentile roll. For an Awareness check, you would roll 1d100 using your might (Awareness + a skill, if you have one) against the difficulty. How well you do on the roll would give you your winsby and how many PP you have.

        For a one-trait ruling calculating PP is: might * (winsby / 100)

        The other sort of ruling you may encounter is a “two-trait ruling”. This is an average of two one-trait rulings. For this sort of ruling, you would use two mights and you would calculate the winsby for both of them like normal. But after you have the two winsbys, you average them together and you average the mights of the two mights you used as well. Then use those averages to figure out the final points produced.

        For a two-trait ruling calculating PP is: averaged might * (averaged winsby / 100)

        Two trait rulings are used for some of our most common actions: magic rulings which use Intelligence and Spirituality mights. And combat rulings which are a combination of two of three mights (Strength, Endurance or Dexterity) depending on your action that round. It’s complicated, but the in-site ruler will handle the math for you most of the time.

        There is a special type of success that comes with two-trait rulings called a ‘lopsided success’. This happens when one trait fails miserably, but the other one succeeds greatly. A lopsided result may have something ‘weird’ happen with it for flavor but the average winsby still determines how successful the roll was. A lopsided success on a fireball may result in a wild blast of out of control fire, but if the roll was a success, you shouldn’t have to worry about lighting the loot on fire or a similar disaster.

        Unsure what an average is? It's adding the two numbers together, then dividing by 2. Check out <a href="http://www.mathsisfun.com/definitions/average.html" target="_blank">mathisfun.com</a> for more information.

        [b]Question:[/b]

        If you have a two-trait ruling, with mights of 45 and 55, and winsbys of 23 and 88 - then how many points did you produce?
      max_score: 4
      multi: false
      random: true
