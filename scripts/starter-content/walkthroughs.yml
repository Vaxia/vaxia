      title: 'Social walkthrough - Sharing'
      body: |-
        We are all responsible for making sure other people have fun and get to share the limelight as well. Share information unless there’s a reason not to - in general the more you help support other players in the session, the more they can support you. Look for opportunities to shine the spotlight on others.

        If your character has many skills he should have many opportunities to shine in a session. But you know that one of the other characters has a similar skillset - and only that skillset - when it comes up, make an effort to defer to the character that genuinely has no other role in the session. Otherwise you’re leaving a player sitting bored while you claim the one opportunity they had to shine.

        That’s just being polite and letting them have a slice of fun too.

