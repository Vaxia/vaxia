      title: 'Social walkthrough - How to complain'
      body: |-
        Something happened in a session or a scene and it's just not sitting right with you. You may be considering calling Real Life Harm, or you may not be getting along with another player, or even with a particular A/SH. It happens, even if we try to avoid it. Don't just let it simmer, that just makes things worse!

        Here's what you do:

        First, stop and think! Wait until you're calmer and reconsider the situation. Are you still sure you were wronged or was it more a misunderstanding?

        Second, talk to the player involved (if you can). Try to get it sorted out amongst yourselves. Be prepared to hear some hard things, or be asked to take specific action.

        Third, if you can't work it out with the player - then talk to an A/SH. The A/SHs are there for that. They may pass you up to one of the other A/SH to handle the situation.

        Fourth, an A/SH may ask you to take specific actions in response to the problem. It's possible you might actually be at fault yourself, if so take the time to really listen to what the A/SH is telling you needs to be done to fix the situation.

        [b]Question:[/b]
        If another player is having problems with me, what's the second thing you should try if you don't know what started it?
