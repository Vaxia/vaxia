      type: multichoice
      title: 'Social walkthrough - Diversity of Play'
      body: |-
        Not all players are playing the same game you are. We all come from different experiences in life. Some of our players have never played outside of this site, some started play in the olden days when Dungeons & Dragons was the only game in town. Some come from the point of view of wanting to play a dramatic story and the day-to-day lives of their characters, while others want to focus on action, adventure, and building a legend for themselves.

        It’s important to note: All of these are completely legitimate ways to play!

        With the many varieties of players as we have, we’re bound to find players whose personal styles just don’t naturally click. There will be misunderstandings along the way. But there’s some steps you can take to help smooth the rough edges. One key element is to remember to make sure your fellow players want to go along with your idea.

        It’s a simple thing: When in doubt, ask.

        And if you are asked, give an honest and clear answer. Not speaking up once you’ve been asked isn’t helpful to anyone.  If you aren’t sure what type of play you prefer, let folks know, and be prepared for the chance that you might discover a style you like (or don’t like) in play.

