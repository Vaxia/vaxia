      type: multichoice
      title: 'Social walkthrough - Starting and Ending RP'
      body: |-
        Joining an existing RP isn't as simple as just jumping into a post. It's very possible the RP you're trying to get in on is a personal scene the players have arranged in advance, and one that's very important to one or more of their characters. You can't really tell from the outside.

        It is always polite to ask before joining first!

        Just drop a OOC post into the room along the lines of "Anyone mind if I join?" If someone does, don't take it personal - some RP is like that. You'll catch them on the next opportunity.

        If a session is in play, or about to be in place, drop a line to the A/SH in Limbo asking to join. Remember a lot of A/SHs will customize their session based on their headcount up to a day before the session - so by joining late you are rattling their plans - if they say no, don't take it personal. If at all possible - make sure to sign up 24 hours in advance for sessions to give them plenty of time to plan.

        Once you’re done with a room it’s polite to say thank you to your RP partner, and make it clear you’re done playing. Not just because it’s nice to say thank you - but also because it makes it easier for other players to tell when you’re done with a slow post in a room.

        A slow-post may have a day or more between each post. If you’re in one be patient. And if you let others know when you’re done that’s a good way to make sure you aren’t keeping others from using the location.

