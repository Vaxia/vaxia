      type: multichoice
      title: 'Social walkthrough - Text communication'
      body: |-
        It is extremely difficult for other people reading your text to  know if you mean your character’s actions to be taken in a positive light or not. A large part of communication simply does not translate to text. For example the facial expression or tone of voice that lets the other person know you’re teasing.

        So it can be reassuring for other players to hear you state that you know that an action your character took - is in fact unwise, reckless or evil. It reassures them that you know the difference between IC and OOC, and that you - as a person - understand the situation, even if your character may not. That keeps any IC blame firmly in the IC where it belongs.

