mediator:
  title: 'Mediator Training'
  body: |-
    [b]What is Mediation here? [/b]Mediation is a process in which a neutral person assists the players in resolving their dispute. The mediator has no authority to impose a result upon the other players, and the players involved can end the mediation at any time. However, then further actions may be required at the recommendation of the social leads. During a Mediation the goal is to encourage dialogue so that an outcome may be reached that keeps the players involved happy and the site at large healthy. The presence of a mediator also helps assure the site at large that steps are being taken to resolve conflict and keep everyone's time here positive. This helps prevent conflicts from having a splash effect over more players than the ones involved in the initial conflict.

    Often times no matter how competently you approach your job as a mediator, the players will still be unable to solve their differences. This is not a failing on your part, nor on the players themselves. Sometimes issues are too personal to be resolved with mediation alone. If you find yourself in a mediation that has failed to produce an amicable result you will need to suggest a course of action to the players involved. This is to help the site continue to run productively and respectfully for everyone.

    This quiz will determine if you are ready to help mediate the conflicts that occur here on site. You are allowed to take the test more than once if you fail. However, we ask that if you have failed the test you take time to read over some conflict mediation literature to better understand exactly what you are expected to do. You can also always ask a lead or another mediator for additional help or clarification if you are unsure about your results. Remember that this is a serious responsibility. It is a very important and respected job, and when you act as a mediator, you must conduct yourself appropriately.

    [b]As a mediator some of your key responsibilities are:[/b]
    -To make proposals to either side so that they can move forward amicably
    -To advance and make clear the interests of the players involved in the dispute so that a mutually satisfactory solution can be found.
    -To keep the tone of the mediation as civil and respectful as possible. A mediation is not an excuse to break the code of conduct. The same rules of behavior apply in a mediation as they do anywhere else on site. Encourage the players to focus on the issues and stay away from personal attacks.
    -To offer a fresh perspective on the conflict. Having numerous options about how to proceed will make the mediation easier for all involved.
    -To remain neutral, no matter what happens. If you cannot be neutral, step aside and ask another mediator or lead to assist you.
    -To make sure that the players involved use clear and concise language so that their opinion can be understood. If you have a hard time understanding what one of the players is asking for, then it's likely the other player involved in the mediation is confused as well.
