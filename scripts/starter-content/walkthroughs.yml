      type: multichoice
      title: 'Social walkthrough - Respecting boundaries'
      body: |-
        People don’t like being randomly touched by strangers in real life. That’s a concept we’re taught from an early age. The same applies in roleplaying as well.

        A scene you are in with another player may make them uncomfortable. That’s not your fault, but they are not obligated to stick around for it. Especially not in an online environment where they may simply logoff. The player does  not have to validate the existence of their emotions regardless of how much others didn’t intend the results, or the logic or lack thereof in having them. (That’s why they’re called emotions.)

        If someone asks for a scene to stop, or has their character firmly walk away without giving any indication they are wanting you to stop them, take the hint and let them walk away.

        If you are confused about what happened, ask later after they have had time to calm down. It is best to do that in private over PMs. The problem may not have had anything to do with you, or it may be something they aren’t comfortable talking about in chat so putting them on the spot in public isn’t going to help.

