      type: multichoice
      title: 'Back to fairness - just like how you have to ro...'
      body: |-
        Back to fairness - just like how you have to roll to do something difficult, there’s a cost for doing more than one action on your turn. Dividing your attention reduces your mights so you should only do it when you really need to or when you know for sure that you can pull it off.

        The first action is free. But for each extra action you take, your mights for all of your actions will be reduced by 20. Remember: that also limits how much PP you can produce, so make sure your mights are high enough to afford to take 20 off the top and still have a good chance to succeed.

        If you are attacking twice in a round, that’s two actions. If you are trying to jump from roof to roof and fire an arrow at the same time, or if you are climbing a tree and trying to sweet talk a cat into staying put. If you’re trying to pull off two different things - that’s two actions.

        For example: Your character is in a fight and needs to end it quickly. So he attacks twice. You'd be taking a -20 might for the extra action to all of your attacks. If your might started at an 80, when we do the math - for both attack #1 and attack #2 we use a might of 80 - 20, or 60.

        This also counts for animal companions. In a session, the A/SH should be the one rolling for the animal’s actions while you roll any animal handling skill you have. Some A/SHs will allow you to roll for the animal’s action yourself - but you will still take the multi-action penalty even if the animal is the one taking the action. Otherwise it’s just not fair to the other players who are limited to their single character's actions.

        [b]Question:[/b]

        Setting aside weapon adjustments, if you take three actions in a round, what is your multi-action-penalty for all three actions?
