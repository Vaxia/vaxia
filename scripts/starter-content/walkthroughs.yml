walkthrough_social:
  title: 'New Player: Social Walkthrough'
  body: |
    Welcome to the social walkthrough. This walkthrough is designed to teach you how we handle the people end of things here. If you're not familiar with roleplaying, or want to make sure you've got a handle on the etiquette here on the site - this is where to start.

    The walkthrough is a guided tour but you'll be asked questions along the way to make sure you have the important pieces down. Don't worry if you have to stop halfway through, just come back when you have more time and the walkthrough will pick up where we left off.

    [b]If you are looking to join the Social department - say so at the end of this quiz to have your score counted.[/b]

    Please re-take the test as many times as you need in order to get through all the questions or if you ever feel like your knowledge is getting rusty. It's really useful to know how things work around here when you're trying to get started.

    [size=30][color=#009900][center][b]Answer the questions below to get started.[/b][/center][/color][/size]
  pass_rate: 100
  randomize: false
  takes: 0
  allow_skipping: false
  summary_pass: |-
    And there you go! You’re all done. Thank you for taking this walkthrough, and please let us know if there’s more you would like to see covered in it.

    [b]You are now a member of the Social department and have access to post on the department's forums. You may be asked to assist the department Lead with site projects and decisions.[/b]

    Please re-take the test as many times as you need in order to get through all the questions or if you ever feel like your skills are getting rusty.

    If you would like to join the department you can do that here:

    [size=30][color=#009900][center][b][url=/content/join-social-department]Join the department here.[/url][/b][/center][/color][/size]
  summary_default: |-
