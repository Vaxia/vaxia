      title: 'There will be times when mediations are not enough...'
      body: |-
        There will be times when mediations are not enough. When that occurs you will often be tasked with figuring out an alternate solution to help the players work through their issues. Try to focus on their specific problems. Whether their biggest issues are IC or OOC, you should be able to find a method that keeps them happy, even if they cannot be friendly to each other.

        However it is possible that the players will agree to some sort of compromise, and then be unwilling to see it through. Perhaps they feel that agreeing to some sort of action will allow them to get back to the game quicker, but they never truly plan on committing to the solution.  

        For example, they might agree to a rotating schedule, but one player keeps showing up saying that they forgot. Or they might agree to separate casual RP but one of the players keeps arriving anyway and forcing the other player to leave. This causes their previous issues to flare back up again. When the compromises that they agreed to are broken, what would you do?
