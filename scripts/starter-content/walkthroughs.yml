      title: 'Learning to be a passive participant in mediations is ...'
      body: |-
        Learning to be a passive participant in mediations is important. Remember that you aren't there in the mediation to force a resolution. You're there to help guide the players having the conflict to resolve their issues at their own pace. This requires finesse and patience. Work on asking fewer questions, and when you do, ask open-ended questions. Compare "Did you  argue?" to "What happened?" Or, "Do you feel anxious about the session tomorrow?" to "How do you feel about the session tomorrow?" An open-ended question is like an essay question which allows the player in the mediation to lead the conversation and clarify his or her own concerns. A closed question is like a true/false question and often suggests or narrows the focus of the Mediation.

        Please give some examples of open ended questions and times when you would use them.
