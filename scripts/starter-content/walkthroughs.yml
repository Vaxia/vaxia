      type: multichoice
      title: 'Social walkthrough - Consequences'
      body: |-
        We’re pretty casual around here, but when a player goes far enough out of line we do have a way of keeping track of problems. We have a strike system on the site - and usually we’ll try to work with you as much as we can before calling for a strike - but it can happen. They come in two flavors “yellow” and “red”.

        A yellow strike is a warning. We keep a record of everything that led up to the strike, so all of our A/SHs will be familiar with what happened. You can get up to three Yellow strikes before we ask you to leave the site.

        A red strike is an instant out. We also keep a record of these and we ban the account.

        We usually try to take other approaches before we reach the level of a strike though. You may be asked to take the social training walkthrough, or asked to avoid another character or player in sessions - you may have to alternate who gets to go to sessions to avoid each other if you can’t otherwise get along. If things get particularly bad we may ask you to take a small break from the site to get your thoughts together. A strike is usually our last resort.

