      title: 'Sometimes a mediation will be needed after two players...'
      body: |-
        Sometimes a mediation will be needed after two players have a particularly hurtful exchange onsite. This could be the sort of thing that happens frequently between the same two players, or it could have been something that was sudden and due to external stimuli of some sort. In either case, there will be times that an apology needs to be tendered by one or more people in the mediation. Most often, people know how to legitimately apologize. Especially after they have calmed down from the initial outburst. But there are times when it can seem disingenuous. Don't hesitate to pause the mediation and ask the player who isn't quite hitting the mark to consider ways to re-word their apology.

        An apology is an act that is neither about problem-solving or negotiation. Rather, it is a way to help gain closure on an issue so that the mediation can move forward into discussion about how to prevent problems in the future. The goal is to allow players to authentically apologize in mediation, but they often need help in getting past the defensiveness and fear of blame that preclude apology. To show genuine remorse is hard in text, so there will be issues occasionally. There are many more steps that can occur afterward, but an apology should be one of the first steps when applicable to the situation. Neither side is required to accept the apology given to them. But if the apology is genuine, they should at least attempt to consider it an olive branch in terms of their future interactions onsite. Apology can not be imposed or forced. It is a moment of opportunity. But know that players may need preparation and help with the words.

        This is a two part question. There will be two hypothetical situations. Please describe how you would respond to both of them.

        Situation A: The two players involved in the mediation have a long standing history of being snide and snippy with each other. Recently it developed into harassment, both IC and OOC. Some of the words used and actions were incredibly hurtful. One player's apologies seem less sincere, and are often followed up with a caveat or a qualifier. How would you help guide  them to make their apologies seem legitimate?

        Situation B: A player is having a bad day offsite and they come on and ask for advice. During the exchange, one player says something inappropriate, and due to the offsite stress, the player who was having a bad day snaps and uses hurtful language. They are pulled aside and asked to calm down. Once they do so, they feel legitimate remorse, but come to you as a mediator to ask for help in wording their apology. What help would you offer to them?
