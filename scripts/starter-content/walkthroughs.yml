# The new-player walkthrough quizzes and mediator training, read by
# scripts/starter-content.php. System, social and mediator training are the
# original VAXIA quizzes with the example realms in place; the setting
# walkthrough tours the example realms (rewrite it for your own worlds).
# Passing a walkthrough lets a player join that department (its Join form).
# Same format as sh-course.yml.

walkthrough_system:
  title: 'New Player: System Walkthrough'
  body: |-
    Welcome to the system walkthrough. This walkthrough is designed to teach you how our dice mechanics work here. Since we have our own system, we know this is the only place you'll have a chance to learn how things work here. So we'll be trying our best to get you up to speed as quickly as we can.

    The walkthrough is a guided tour of the system but you'll be asked questions along the way to make sure you have the important pieces down. Don't worry if you have to stop halfway through, just come back when you have more time and the walkthrough will pick up where we left off.

    [b]If you are looking to join the System department - say so at the end of this quiz to have your score counted.[/b]

    Our A/SHs will handle all the ruling of this for you, so you don't really have to know how this works before you dive into session, but it can be really useful to understand the system so that you know what your options are.

    Please re-take the test as many times as you need in order to get through all the questions or if you ever feel like your skills are getting rusty. It's really useful to know how the system works when you're building a character or in a session and want to know how the A/SH got the numbers they got.

    [size=30][color=#009900][center][b]Answer the questions below to get started.[/b][/center][/color][/size]
  pass_rate: 100
  randomize: false
  takes: 0
  allow_skipping: false
  summary_pass: |-
    And there you go! You’re all done. Thank you for taking this walkthrough, and please let us know if there’s more you would like to see covered in it.

    Please re-take the test as many times as you need in order to get through all the questions or if you ever feel like your skills are getting rusty. It's really useful to know how the system works when you're building a character or in a session and want to know how the A/SH got the numbers they got.

    If you would like to join the department you can do that here:

    [size=30][color=#009900][center][b][url=/content/join-system-department]Join the department here.[/url][/b][/center][/color][/size]
  summary_default: |-
    You did not pass this test.

    Please re-take the test as many times as you need in order to get through all the questions or if you ever feel like your skills are getting rusty. It's really useful to know how the system works when you're building a character or in a session and want to know how the A/SH got the numbers they got.

    <a href="/quizzes/new-player-system-walkthrough">Click on the "Take" tab to get started.</a>
  questions:
    -
      type: multichoice
      title: 'System walkthrough - Stats'
      body: |-
        Stats describe your character's basic abilities in specific terms. These numbers represent how strong, fast, smart or healthy your character is. There are two types of stats, "Primary Stats" and "Derived Stats".

        Primary Stats are stats you can spend XP on to improve. Raising a stat costs 1 XP a point up to 20, then the current value in the stat / 10 (rounded down). For example: a primary stat at 34 costs 3 XP to raise.

        The primary stats are:

        [b]Life:[/b] How long the character can keep on ticking.
        [b]Endurance:[/b] How well the character takes punishment before getting winded or hurt.
        [b]Strength:[/b] How strong the character is.
        [b]Dexterity:[/b] Hand-eye coordination, or coordination of any other body part.
        [b]Intelligence:[/b] How smart the character is and how fast he learns.
        [b]Spirituality:[/b] How much inner balance and strength of mind the character has.
        [b]Charisma:[/b] How much influence the character has on others.

        Derived stats are an average of two primary stats. In order to raise one of these, you need to raise the two primary stats that go with them. You cannot raise any of these stats directly.

        [b]Health:[/b] Average of Life and Endurance. How resistant to getting sick the character is.
        [b]Constitution:[/b] Average of Endurance and Strength. How much stamina the character has.
        [b]Agility:[/b] Average of Strength and Dexterity. How athletic the character is when moving.
        [b]Finesse:[/b] Average of Dexterity and Intelligence. How quickly can the character react and how good they are at fine-detailed work.
        [b]Awareness:[/b] Average of Spirituality and Intelligence. How conscious of the surroundings your character is.
        [b]Presence:[/b] Average of Charisma and Spirituality. How compelling your character's personality is.
        [b]Appearance:[/b] Average of Life and Charisma. How attractive (without trying one way or the other) your character is.

        Unsure what an average is? It's the two numbers, divided by 2. Check out <a href="http://www.mathsisfun.com/definitions/average.html" target="_blank">mathisfun.com</a> for more information.

        [b]Question:[/b]

        In order to raise your Awareness what stat(s) do you have to increase? Check all combinations that apply.
      max_score: 4
      multi: true
      random: true
      boolean: false
      answers:
        -
          answer: Intelligence
          chosen: 2
          not_chosen: 0
        -
          answer: Awareness
          chosen: -1
          not_chosen: 0
        -
          answer: Charisma
          chosen: -1
          not_chosen: 0
