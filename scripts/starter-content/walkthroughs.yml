      type: multichoice
      title: 'System walkthrough - Combat'
      body: |-
        The meat of the matter!

        Combat is the most complicated part of any system, so we’re going to split this up across a couple of topics.

        Combat rulings are a two-trait ruling. Depending on your action, your ruling may involved your Strength, Dexterity or Endurance.

        You’ll notice in sessions that we ask for all three (Strength, Dexterity and Endurance) rolls from characters. Not all of these rolls are going to be needed in a specific round - but they could be and it saves time to just ask for all three instead of asking for the specific ones we need after everyone has posted.

        When attacking, a character uses his Strength and Dexterity mights against a difficulty of the opponent’s Endurance and Dexterity mights. It is possible, if both characters are attacking instead of defending, for both to take damage in a round. (May the toughest character live the longest.)

        [b]Question:[/b]

        If character A has a Strength of 25, a Dexterity of 30 and an Endurance of 35, and the skill Swordplay at 25. Then what are the difficulties for character B to hit character A?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: 'The difficulties are 55 and 60'
          chosen: 4
          not_chosen: 0
        -
