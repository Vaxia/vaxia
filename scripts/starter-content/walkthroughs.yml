      type: multichoice
      title: 'Social walkthrough - Conflicts and PVP'
      body: |-
        Not all players are comfortable with PvP, or if they are, not on all their characters. That’s ok.

        We want to support both PvP and non-PvP play styles on the site, but we respect the real life harm that can come with mixing those groups. If you are getting into a situation where that looks like it may be a possibility - pause first and ask. That’s being respectful of your fellow players who might not otherwise speak up.

        Similarly, if you see a situation coming and already know that you yourself are ok with getting into the rough stuff - let your fellow players know. Simply knowing that you’re ok with getting the whuppin’ you’ve earned is a great way to let your characters get on with the scene, without making everyone else nervous that you’re about be upset or hurt out of character.

