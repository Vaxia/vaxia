      type: multichoice
      title: 'Social walkthrough - OOC vs IC'
      body: |-
        You’ll see “OOC” and “IC” floating around a lot on the site. Those stand for “Out Of Character” and “In Character”.

        Out of character is stuff you, as the player know about and consider. In character is stuff your character knows. You know both the OOC and IC, but your character only knows the IC. That means, your character shouldn’t use any of your OOC knowledge. If you need to take notes - do that! Plenty of people do. Each character sheet has a section for “Player Notes” - that’s for you to write down anything you need to.

        Playing two of your characters at once - we really really don’t recommend you do this. Not only is it a bit presumptuous to assume your character’s know each other, but it puts you in a sticky spot. You’re your own best friend - that means you’re in conflict of interest for any favors your characters do for each other. It’s a form of cheating! Your characters shouldn’t share information, silver, or items. Even if it’s innocent, just chattering with yourself, we really don’t recommend making a habit of it - it looks bad, and it won’t be long before someone asks if you are using OOC knowledge.

