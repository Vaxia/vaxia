      type: multichoice
      title: 'System walkthrough - Succeeding and Failing'
      body: |-
        Successes are based on the action you described when you made the post. If you only want to wound someone, a high success gives you exactly that. A high PP won’t accidentally kill them instead if that’s not your stated goal. If you only want to knock someone out same thing - what you’ve described as your goal is what will happen if you succeed.

        The more PP you have, the closer to your described result you get.

        A narrow success is one where you succeeded barely. It’s a ‘kinda’ result - barely scraping by - when your winsby is between 0 and 10. You may need to try again on the next round to make it the rest of the way.

        A ‘normal’ success has a winsby between 10 and 25. This roll will achieve what you described, but you don’t get any additional style points for it.

        An ‘exceptional’ success is one where your winsby is over 25. This is a spectacular success where you make it look easy. Your A/SH may grant additional benefits with this sort of roll.

        [b]Question:[/b]

        If you have a winsby of 12, what sort of success is it?
      max_score: 4
