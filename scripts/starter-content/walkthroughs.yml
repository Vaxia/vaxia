      body: |-
        Our site policies can be found on the wiki under <a href="/wiki/site-policies" target="_blank">Site Policies</a>. New players to the site should take time to look over this section of the site in particular. There’s a lot of really good information in there.

        The <a href="/wiki/code-conduct" target="_blank">Code of Conduct</a>, as you’ve seen on other sites, should give you a good understanding of the behavior expected of our site members. “<a href="https://www.youtube.com/watch?v=t3ICRoe-QIw" target="_blank">Wheaton's Law</a>” also sums it up nicely.

        We also have a <a href="/wiki/harassment-policy" target="_blank">Site Harassment</a> policy. While the Code of Conduct covers most behaviors, the harassment policy goes into more detail for player interactions and covers specific circumstances.

        We also have a rule on the site called <a href="/wiki/real-life-harm" target="_blank">Real Life Harm</a>. You might see it abbreviated as “RLH”. When something in a scene or session goes way over your personal boundaries and risks driving you off the site, or to abandon the character, you can invoke real life harm to ask the A/SHs to adjust the situation back to something you’re more comfortable with. Real life harm is not about avoiding disappointing outcomes in a session, and we will notice if you abuse it for that.

