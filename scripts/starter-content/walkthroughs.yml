      type: multichoice
      title: 'Social walkthrough - Handling disappointment'
      body: |-
        Disappointment is bound to happen just as it happens in real life. Sometimes the dice are not nice or someone's character did something that mess up your character's plan. It is just like our own troubles we encounter in life. It is ok to feel disappointment, but there are ways to handle it correctly. 

        Don't just throw tantrums. If you need to, take a breather. Then if you feel the need to express in public don’t blame, try to express your issue and offer reasonable solutions to fix it. If you are unable to, then seek out one of our A/SHs - they may be able to work with you to get to that point. 

        Try and see the whole picture, often its just a matter of perspective. Try and step back and look at everything: Did your expectations vastly differ from everyone else's? What was the belief behind your expectations? Is your expectation a reasonable or a likely outcome? If you are having trouble trying to see all sides of the situation then seek out one of our A/SHs - they may be able to help you see the other angles.

        Learning from disappointment. This can often be the hardest thing to do. But once you have a cooler head try and look back at the situation, is there something you can learn from it? Often it could have just been a misunderstanding so next time you know to ask for a little more clarification before you think on how your character acts.

        Lastly there is acceptance. Not all situations that lead to disappointment can be changed. It is important to work through your disappointment, see all sides, see what there is to learn, accept what happened and then begin the process of moving on.

