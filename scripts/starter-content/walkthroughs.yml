      type: multichoice
      title: 'Social walkthrough - How to ask for RP'
      body: |-
        Sometimes roleplay just happens, however there are times we may have to let people know that we are interested in doing some roleplay. The easiest and most obvious way is to politely ask if anyone would like to come and roleplay with you. The most common place to ask this would be in Limbo as many of us hang out there during the course of our day in order to be with our friends here.

        When asking to roleplay try to include things like which character you are thinking about playing and a possible location. Be ready to offer more than one location or character if the other player doesn’t have one that matched your first suggestion. Work together.

        Roleplay can also be arranged in the forums or through PMs as well. In the forums there is an In Character section where people can post things pertaining to events that may happen in the IC world. Usually this is a place to post letters from one character to another, or advertise flyers or poster a character may be placing. People can reply with their character’s reactions which may lead to a schedule meeting for roleplay. Sessions will often be posted in the General Discussion area of the forums so people can sign up.

        On occasion schedules just don’t sync up, after all we have people from all over the world playing here! This is where slow posting comes in. Slow posting roleplay can be arranged over the forums or PMs as well as in limbo. It works just like normal roleplaying does – just at a much slower pace. For <a href="/wiki/slow-posting" target="_blank">more information about slow posting go here</a>.

