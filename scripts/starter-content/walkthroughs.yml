      type: multichoice
      title: 'Social walkthrough - Respecting time'
      body: |-
        Our A/SHs aren’t paid. But they’re also not independently wealthy either - that means for the most part they have jobs. So be patient with requests, especially if there’s a lot of other activity on the site at the time. We try to handle everything within 72 hours (that’s 3 days). Usually we get to it sooner - but sometimes there’s just too much to get done.

        Being mindful of the time also applies to sessions - while we know sessions will run over. And they do more often than not - if you then get into a PvP fight immediately after - understand you’re tying up an A/SH who may already be past their bedtime for potentially another four to five hours of play. They need to sleep sometime!

        In those situations, offer to pause the situation and schedule it for a better time - your A/SH and your fellow players will be grateful for the courtesy.

        We span across multiple timezones - it can be tricky to make arrangements, and of course adding in work, school, and personal schedules - sometimes it’s just not possible for an A/SH to match your schedule to theirs. It’s not personal.

        If there is an A/SH or a player you want to play with and you can’t find a time that works, consider inviting them to a slow post.

