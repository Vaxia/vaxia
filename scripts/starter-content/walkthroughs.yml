      type: long_answer
      title: 'As a mediator you need to be on the lookout for possible...'
      body: |
        As a mediator you need to be on the lookout for possible traps that players will set for you. It is unlikely to occur, but there will be times that a player will try to trap you or the other player.  They may attempt to get out of their responsibility by forcing you into a position where you say something without realizing the double meaning. Here are some types of traps to look out for  during mediations.

        -The Prediction Trap: Asking you to predict or guess what might occur, and then considering it to be fact rather than speculation. Do not be overly cautious or overly confident when you enter into a mediation. If you do this, you run the risk of extending the mediation. The best course of action during a "Prediction Trap" is to explain that you cannot speculate, and ask them a question to get the focus back onto the mediation and their role in it.

        -The Framing Trap: Causing you to use your own past experiences to adjust (or frame) your own view of the conflict in order to better suit their needs. Remember, in a mediation you must always be neutral and try not to consider anything but the current situation.

        -The Comfort Zone Trap: It is possible that if you have already helped with a mediation in which the outcome was [X] you may find yourself leaning toward that same resolution in the future. Remember that every conflict is different. If you always advocate for one specific resolution players may attempt to use that to their advantage.

        -The Supporting Evidence Trap: Having a clear view of both sides of an argument is vital. If one player seems particularly willing to give ancillary evidence that they're right, you'll want to make sure you get copies from both players if you can. It can be exceedingly hard to tell who's telling the truth so make sure that you don't just get the story from one side of the mediation. You can always ask the technical admin to confirm the onsite communications. If something seems amiss, it is very wise to double check.

        There are other types of course. But they are rare enough that you hopefully won't face any of these traps. Paying close attention to the wording and possible outcomes from your answers will help you spot a situation like this before it becomes an issue.

        How would you respond to the following situation. You are mediating for two players. One of whom is also a mediator. Player A has worked on mediations before and knows that showing evidence can be key to getting out of a problem, so they do so in abundance. Even including things that may not be relevant to further cloud the issue. They also occasionally pepper in phrases aimed toward you like "You know me" or "I'm trained to help people." Whether intentionally or not, they seem to be putting you into a situation where you or the other mediator may be trapped. How would you respond to the situation?
      max_score: 10
    -
      type: long_answer
      title: 'Sometimes the site will have a player who shows repeated...'
      body: |-
        Sometimes the site will have a player who shows repeated instances of difficult behavior. Difficult behavior is essentially that which inhibits the productivity, site enjoyment, and well being of others. Left alone it will get worse, affect more people and continue to cause ripples of conflict throughout the site. Most difficult behavior is accidental, but it can also be the result of intentional thought. Sometimes it is sporadic and takes us by surprise. At other times it is ongoing and forms patterns. It's important to remember that difficult behavior can take many forms as well. It includes gossiping with the intent to get someone else in trouble, going over an SH's head, foot dragging after a request is made, outright ignoring a request that was made, being rude, "yelling" at other players, ignoring others to cause them to feel shunned, harassment of any sort, and much more. You'll know difficult behavior when you see it even if it's not on this list.

        Here are some suggestions on ways to help deal with difficult behavior.

        -Stay centered. Don't let your personal feelings affect your response. As a mediator, you must remain neutral at all times no matter how hard you're pushed. If you can't be neutral, then pass the mediation to someone else. It's better than taking the low road that you have been goaded into.

        -Give yourself a reality check. Is it possible that the player's behavior isn't as harmful, but you're compounding it based on past events? If so, try to take a step back and once again only look at the current situation. If a pattern has emerged, that's a different story, but if you're finding an isolated event to be bigger than it normally would be, you may be feeling compromised yourself.

        -Focus on the behavior, and not the player. If you focus on the behavior as a separate entity it's more likely that the player will be open to change. If they feel personally targeted, they will be less likely to adjust their behavior. Remember, be soft on the player, and hard on the behavior.

        -Listen carefully. It's easy to get swept up in the chaos that can come along with disruptive and difficult behavior. The key in all mediation is to listen. Often times the root of the problem is hiding right behind the wall of static that is being caused. If you listen carefully you will be able to help more effectively.

        -Give feedback directly and honestly to the player. A common problem with difficult behavior is that the person is unaware that his or her behavior is causing a problem. At other times the extent of the impact is not comprehended. By giving timely feedback about specific behavior misunderstanding can be avoided and expectations clarified

        -Consider bringing in an additional mediator. Sometimes it helps to get more than one person to brainstorm ways to effectively alter difficult behavior without causing the player harm. During a full mediation you will always have at least one lead already in the discussion. But if you find yourself without another Mediator or lead, feel free to get one to help. They won't be there just to 'back you up" but they will be there to offer a fresh set of eyes.

        -Using formal authority should only be as a last resort. Don't immediately pull out the card that you're in a position of authority over them. This will cause the player to view everything that occurs afterward under the lens of a hierarchy. While they might initially listen, they will eventually revert to the previous behavior and be even less likely to change due to the power imbalance they now feel exists.

        -Remember we're all humans here. The reality is that we can all be difficult from time to time. So treat others with the respect you would want if you were in their shoes. Dealing with difficult behavior is not easy and so we often procrastinate. We do so at our own peril. Being proactive and engaging the person in a conversation about their behavior is the first step toward conflict resolution.  

        Now then, considering the above, here is the question. You have a player that is constantly harassing other players on site. There seems to be no logical pattern to the timing, but they are constantly stepping on toes. This causes people to react back to them, often in poorly chosen ways. So other players are now also getting in trouble for the original player's outbursts. This makes the original player even more vocal about how they're right. They are getting attention and after some reinforcement of their bad behavior they show no signs of stopping. What would you do?
      max_score: 10
