      type: multichoice
      title: 'System walkthrough - Automatic Ablities'
      body: |-
        There are no 'free' abilities here such as racial abilities, bonuses or immunities that you may encounter in other systems. Almost all activities require a might and a roll of the die to see how well characters perform. If your character is doing something outside the realm of 'normal' (ie. something that everyone can do, like walk down the street), you will need to roll to see how well a character does.

        This touches on the idea of ‘fairness’ in our system.

        Since a character is basically just a set of stats and skills, granting an automatic ability outside of that isn’t fair to other players who would have to pay for that ability. You need to have a roll to go with whatever you’re trying to do if it’s beyond the ‘normal’ ranges for any other player to do it.

        For example: A character chasing after a bad guy doesn't really need to roll for that. But a character who wants to chase after him more quickly than your average runner or wants to use Acrobatics to catch up with the bad guy - needs to roll to do that.

        Another example: A character may be blind, but want to use Aura Reading to ‘see’ his surroundings. Since this isn’t any more information than a normal character would get with normal eyesight - that’s ok to do without a roll. But if the character wants to be able to ‘see’ around a corner, through walls, or tell how another character is secretly feeling - now he needs to roll.

        Yet another example: A character may be playing a species known for having a super-sniffer or super-hearing. But they will still need to roll to play bloodhound or overhear the wingbeat of a hummingbird in the distance.

        If what you're trying to do is against another character, then the character is able to resist (and assumed to be resisting unless they say otherwise). In those cases, you would use their might as your target.

        [b]Question:[/b]

        If your character wanted to specifically read the aura of another character for details on health, mood or personality, how can you do that?
