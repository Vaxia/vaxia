      type: multichoice
      title: 'A spell against a resisting target is cast agai...'
      body: |-
        A spell against a resisting target is cast against the difficulty of the spell plus the target’s might. Everyone is assumed to be resisting unless they say otherwise. Usually the target’s might is just their stat, but sometimes they have a skill that matters as well. This tells you how innately resistant to the magic your target is.

        A spell may succeed, but fail to affect a target if they have a high enough might.

        Physical spells that operate on the body are resisted using Dexterity and Endurance. Mental spells are resisted using Intelligence and Spirituality.

        If a spell causes direct physical damage, such as a fireball, it is generally resisted using physical stats. If a spell meddles with the mind or spirit it is generally resisted with mental stats and usually inflicts positive or negative bonuses to the target’s actions instead of direct damage. If in doubt, use what you're trying to do to determine which resistance to use. If you're trying to deal damage - physical. If you're trying to create a bonus - mental.

        Passively resisting a spell does not cost an action since the difficulty numbers are just how innately hard to hit you are.

        You may also use an action in a given round to attempt to actively dodge or block a spell just like you would any other type of attack, but as usual, it requires an action. If you want to try and dodge a spell and attack in the same round, standard multi-action penalties will apply.

        [b]Question:[/b]

        If you cast a fireball at a zombie, and you have a positive winsby against the base difficulty of 25, but failed against 25 + the zombie’s stat of 20 - what happens?
