      type: multichoice
      title: 'Social walkthrough - Respecting work'
      body: |-
        A/SHs go to a lot of effort to run games here and they are all volunteer. There’s a lot that goes into running in a shared game setting without stepping on each others toes, and a lot of work to keep from treating other player’s characters unfairly. They have to be trained, take tests, and work through multiple sessions before they are allowed to run freely. Many of our A/SHs take a good chunk of their time before and after a session to plan it, write up the report for after, and plan for any future sessions that may occur as fall out.

        That sort of training doesn’t happen overnight, so please respect the work that our A/SH undertake to bring stories to life for the site.

        If a specific session doesn’t ‘fit’ for your character concept then see if you can find a way for the character to fit, bring another character, or bow out gracefully. Don’t try to make the A/SH feel like they’re responsible for actions that are ultimately under your control - it’s your character and your fingers typing at the keyboard.

