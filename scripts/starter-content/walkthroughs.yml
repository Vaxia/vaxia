    -
      type: multichoice
      title: 'System walkthrough - Going First'
      body: |-
        Usually when we post in a session, we assume all the actions are occurring at once. That helps a session go more quickly. But sometimes order matters - for example: if one character is trying to hit a target that another character is trying to protect.

        Determining who goes first means looking at the stats for the characters involved.

        Usually the A/SH will use the PP from the character’s Dexterity ruling or Intelligence ruling in that round. If neither of those stats were rolled then they would use derived stats (Agility, Finesse, Awareness, Presence) instead. If nothing was rolled, then they would look at the stats directly.

        [b]Question:[/b]

        Two characters are in range to attack a target one with a sword the other with a fireball, character A has 34 PP on his Dexterity from his attack ruling and character B has 30 PP from his Intelligence on his fireball. Which hits first, the sword or the fireball?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: Sword
          chosen: 4
          not_chosen: 0
        -
          answer: Fireball
          chosen: 0
          not_chosen: 0
    -
      type: multichoice
      title: 'System walkthrough - Active Defense'
      body: |-
        When not getting hit is more important to you than hitting - you should describe your character as taking a defensive action. The dice to roll is still the same: Strength, Dexterity, Endurance plus any relevant skill.

        But instead of trying to generate PP to cause damage to your enemy, you’re trying to generate PP to negate the PP he’s attacking you with.

        There are three types of active defense:

        Blocking - Pits the defender’s Str/End mights against the attacker’s Dex/Str mights 
        Dodging - Pits the defender’s Dex/End mights against the attacker’s Dex/Str mights 
        Parrying - Pits the defender’s Dex/Str mights against the attacker’s Dex/Str mights 

        Notice that an attacker has to use his Dexterity and Strength, but a defender can choose any of the two stats to defend with. Which one you go with depends on your description in your action, so be sure to describe it in enough detail that your A/SH can tell what you want to do. Or include a note in the OOC if you're worried there may be confusion on what you're trying to do.

        Actively defending against an attack counts as an action - so multiple-action penalties apply if you are also attacking in that round. If you hit a target twice in a round, but they only rolled for one attack (or defense), then they don't have any active defenses for the second attack. While they don’t take the multiple-action penalties since they didn't try to do two things, they also don’t get a benefit of a roll to attack or defend either.

        [b]Question:[/b]

        If you’re playing a rogue, squirmy and tough but not very strong, what sort of defense should you use to avoid getting hurt by a much bigger opponent?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: Blocking
          chosen: 0
          not_chosen: 0
        -
          answer: Parrying
          chosen: 0
          not_chosen: 0
        -
          answer: Dodging
          chosen: 4
          not_chosen: 0
    -
      type: multichoice
      title: 'Making more than one attack is just another for...'
      body: |-
        Making more than one attack is just another form of multiple-actions. So for every attack you roll for after your first, you will take a multiple action penalty. If you miss on your first attack, your other attacks can still hit, so missing on one attack doesn’t impact the others.

        Certain weapons can affect the normal penalties for multiple actions to reflect lighter or heavier weapons.  Unarmed combatants and those using Light weapons subtract 10 from the normal multiple action penalty, whereas Heavy weapon wielders take an additional 10-point penalty.  Medium weapon wielders and anyone doing any other type of action use the standard multiple action penalty.

        The impact of your weapon on the multiple-action penalty (or MAP) is a flat penalty, meaning a Light weapon wielder takes a penalty of 10 instead of 20 if they take two actions, and 30 instead of 40 if they take three actions in a single round.  A Heavy weapon wielder's 2nd action is at a 30-point penalty, and their 3rd action is at a 50-point penalty.  Again, the 10-point additional penalty for wielding a heavy weapon is applied on the 2nd action, and trickles down from there.

        To think of it another way, first figure out what the total penalty would be for a Medium weapon wielder taking as many actions, then apply the adjustment for Heavy or Light weapons to that number.

        [b]Question:[/b]

        If a heavy-weapon wielder attacks four times in a round, how big is their multiple action penalty?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: '-70 to my might'
          chosen: 4
          not_chosen: 0
        -
          answer: '-90 to my might'
          chosen: 0
          not_chosen: 0
        -
          answer: '-60 to my might'
          chosen: 0
          not_chosen: 0
    -
      type: multichoice
      title: 'Damage in combat is directly related to the amo...'
      body: |
        Damage in combat is directly related to the amount of PP you produced. Successfully hitting with a weapon could be a matter of being more strong when you hit - or more dexterous in picking your location - and both Strength and Dexterity mights contribute to the PP for the hit. While a higher might produces higher amounts of PP but it isn’t the only thing that increases the PP you produce - weapons help too.

        Weapons enhance the damage dealt by a character. Additional weapon damage is calculated using the PP so they are not affected by the relative Strength or Dexterity of a character wielding the weapon. The weapon type's extra damage only comes into play after all the other math is handled.

        A weapon will list a certain percentage based on the type of weapon it is. The damage dealt is increased by that percent before it is applied to the target. The percentage of the weapon is added last after all other calculations are complete.

        [i]* Weapon percentage damage and multiple attacks have been reviewed by the site and flagged for revision by a site proposal - so it may be going through a number of changes in the next few months as we study the effect it has on damage output. While the percentage damage will still be calculated the same way - the multiple-action penalty may be adjusted up or down for different types of weapons.[/i]

        [b]Question:[/b]

        A knife fighter generated 50 PP on  his attack, a knife grants 15% extra damage. How much damage does he deal to the target? A swordsman generated 45 PP on his attack, how much damage does his sword of 45% generate?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: 'The knife fighter dealt 50 damage, the swordsman 45 damage.'
          chosen: 0
          not_chosen: 0
        -
          answer: 'The knife fighter dealt 58 damage, the swordsman 65 damage.'
          chosen: 4
          not_chosen: 0
        -
          answer: 'The knife fighter dealt 8 damage, the swordsman 20 damage.'
          chosen: 0
          not_chosen: 0
    -
      type: multichoice
      title: 'System walkthrough - Ranged Weapons'
      body: |
        Ranged weapons are handled exactly the same way melee weapons are: they use Strength and Dexterity like any other weapon does. Since we are a text-based game, the benefits of a ranged weapon are rarely closely tracked enough to be beneficial enough to use a different system. We simply don’t use a map often enough for it to matter.

        There are specific types of ranged weapons that do something ‘odd’ though with strength. Muskets, rifles, crossbows and modern firearms do not rely on the strength of the wielder in their rulings. These weapons have their own Strength based on the power of the ammunition or the design of the weapon - so they replace the wielder’s Strength in rulings. Even if the wielder is stronger than the weapon, the weapon's Strength is used instead These sorts of weapons are more common in the Science Fiction realm.

        [b]Question:[/b]

        What stats should I roll to fire a bow?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: 'Strength and Dexterity'
          chosen: 4
          not_chosen: 0
        -
          answer: 'Strength and Finesse'
          chosen: 0
          not_chosen: 0
        -
          answer: 'Strength and Endurance'
          chosen: 0
          not_chosen: 0
        -
          answer: 'Dexterity and Endurance'
          chosen: 0
          not_chosen: 0
    -
      type: multichoice
      title: 'System walkthrough - Death and Healing'
      body: |-
        Like most systems, when you take damage in a combat, it is possible to die!

        You have as many hit points as you have Life score. So if your Life is 30, you have 30 hit points. Damage is dealt to your hit points.  

        At zero you will fall unconscious, and at negative Life you’ll be dead. Resurrection is not easy here - so try not to get dead. Thankfully, you don’t have any negative modifiers just for being hurt, so you’re just as effective in a fight all the way down to your last hit point. 

        Healing works the same way. Spells or skills used to heal generate PP that add directly to your current hit points, up to the maximum of your Life score. Magical healing does leave scars behind - so keep that in mind for roleplaying purposes.

        [b]Question:[/b]

        If you have 30 Life and you just took 7 points of damage - how much more could you take before you drop unconscious?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: '23 damage'
          chosen: 4
          not_chosen: 0
        -
          answer: '30 damage'
          chosen: 0
          not_chosen: 0
        -
          answer: '53 damage'
          chosen: 0
          not_chosen: 0
    -
      type: multichoice
      title: 'System walkthrough - Types of Experience'
      body: |-
        The higher your stat or skill is then the more XP it will take to increase it. There are a couple of ways to earn XP here: either by posting on your character in IC locations or awarded by a SH when participating in sessions.

        KXP is the smallest unit of XP. You earn KXP every time you make a post on your character in an IC location. It takes 70 KXP to get 1 spendable XP.
        [i]Right under the drop-down box where you select your character you can see how much KXP you have earned and any XP you have earned.[/i]

        When you reach 70 KXP and get 1 XP you also get 1 RXP. RXP can not be spent! 
        What RXP does is track how much XP you have earned by just posting on your character. RXP is used to unlock XP awarded from a session.

        Banked XP is session awarded XP that was locked away.
        If you have 0 RXP, and earn XP from a session, then all that XP goes into BXP and has to be unlocked.  BXP can be unlocked into spendable XP by earning RXP through roleplaying the character. So each time you earn 1 XP, you get another 1 XP, earn 1 RXP, and lose 1 BXP. 
        [i]Sometimes session XP will come in 'flavors' - good, evil, warrior, mage, charismatic, smart - this is only so you have some clear feedback on the sort of behaviors your character is getting known for.[/i]

        HXP is historical XP. This is the total amount of XP your character has earned over their lifespan. HXP can be transferred to a new character when you retire the old character.

        Yeah - it's really complicated, I know. Here's the main take-away: Our XP system is designed to encourage you to participate in both session and casual RP to unlock all the XP you have been given. Do a mix of both and you'll be in good shape.

        Example:
        Gina has a character she goes to a session with. The RP actions she types out earns her character 1 XP (70 KXP). This means her character now has 1 XP that she can spend, and 1 RXP counter. Her character is awarded 4 XP for participating in the session. This means that now she has 2 XP and 3 BXP, and 0 RXP. She only has the 2 XP because she got 1 for her own RP, and then 1 from the award to her since she only had 1 RXP. This means the remaining 3 XP from the award goes to BXP.
        The next day Gina does some casual RP with a friend, she does another 70 KXP worth of play earning another 1 XP; however since she has BXP, she also unlocks 1 BXP. Therefore earning 2 XP. So now Gina has 4 XP, 2 BXP, and 1 RXP. She can spend that 4 XP to improve her character Stats and skills.

        To recap:
        [list]
        [*]70 KXP = 1 XP
        [*]XP stands for experience points. This is what you will spend to make your character more powerful.
        [*]BXP stands for banked experience points. These points can not be spent, but have to be unlocked through roleplaying.
        [*]RXP stands for roleplaying experience points. These points can not be spent, is more like a counter for how much XP a player earned by roleplaying.
        [*]HXP stands for historical experience points. These points can not be spent but can be transferred when the character is retired. It a record of the total amount of XP the character has earned.
        [/list]



        [b]Question:[/b]

        If you have 0 XP, 3 BXP, and 2 RXP, and you just got 6XP in a session, what are your XP, BXP, and RXP totals after?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: '2 XP, 7 BXP and 0 RXP'
          chosen: 4
          not_chosen: 0
        -
          answer: '6 XP, 3 BXP and 0 RXP'
          chosen: 0
          not_chosen: 0
        -
          answer: '4 XP, 6 BXP, and 3 RXP'
          chosen: 0
          not_chosen: 0
    -
      type: multichoice
      title: 'System walkthrough - Getting New Skills'
      body: |-
        If your character has less than 20 HXP, he’s still new enough that you can ask the A/SHs to make changes without having to RP them out first. Your character concept may have changed in the RP that you’ve had with him, and we assume you're feeling out the new character still - so this is your chance to update the character sheet to match.

        Once you pass the 20 HXP mark, you will need to work to gain a new skill by roleplaying the learning process in-character.

        The base RP requirement to learn a new skill on your own is 3 XP, or 210 KXPs, worth of posting. If working with a trainer (an NPC or PC with a skill of 40 points or higher in the relevant area), the RP requirement is reduced to 2 XP, or 140 KXPs worth of posting.

        You can track your progress with a scene, and once you have completed it, post the scene to the SH Request forum for the right setting to get the skill added to your sheet. You will need to include the wording of the new skill so the A/SH can add it - and you may need to work with one of our evaluators to get it right just like you did when you started the character.

        [b]Question:[/b]

        Your character’s friend has offered to teach him water magic.  What will he need before he can act as a teacher?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
          answer: 'A stat of at least 40'
          chosen: 0
          not_chosen: 0
        -
          answer: 'A skill of at least 40'
          chosen: 4
          not_chosen: 0
        -
          answer: 'A might of at least 40'
          chosen: 0
          not_chosen: 0
    -
      type: multichoice
      title: 'System walkthrough - Learning Languages'
      body: |-
        You start play knowing three languages at native fluency.

        After starting, languages are earned in much the same way skills are. The character needs to roleplay out at least 1XP worth of posting to begin learning the language. Languages are not paid for with XP like skills are!

        Rolling for understanding a language just isn't a thing we roll for, any more than eating or breathing would be. It makes no sense to create a skill for that.

        So practicing with a language is just a matter of more RP with it.

        1XP worth of posts - learner, you can recognize the language written or heard
        2XP worth of posts - basic understanding and vocabulary, not able to hold a conversation easily
        3XP worth of posts - conversationally fluent, with an accent
        4XP worth of posts - conversationally fluent, with an accent and an understanding of idiomatic phrases
        5XP worth of posts - equivalent to a native speaker

        [b]Question:[/b]

        If you want to learn how to speak orcish enough to ask directions out of town, how much XP worth of posting should you do?
      max_score: 4
      multi: false
      random: true
      boolean: false
      answers:
        -
