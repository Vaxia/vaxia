      type: multichoice
      title: 'Social walkthrough - Playing evil'
      body: |-
        Want to play an evil character?

        Go right ahead!  But understand this can be tricky. Unlike your usual tabletop game, here players and characters will walk away if things get unpleasant enough. If your character is routinely abusive you should expect the same results you would get in real life for being a jerk. Which can make for some very boring solo roleplay for the rest of the character’s life.

        Playing evil requires walking a fine line between offending or harming characters and offending or harming their players.  

        Lastly, remember that evil people have friends too! Disney villains aren’t the most common of evils out there, and rarely does a character (or a person) cast themselves as the ‘bad guy’ of their own story. Evil characters should still be fully developed personalities, with motives and desires - and friends. 

        That means they will occasionally sacrifice being evil for helping a friend out or being generally agreeable, if only to a handful of people (who may be just as villainous as they are).  That will help keep your character complete, and often make them more likable to players, which should help ensure you can participate in RP with others without constantly chasing them off or getting your character in inescapable trouble (like death or jail).

