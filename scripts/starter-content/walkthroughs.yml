      type: multichoice
      title: 'System walkthrough - Rolling Dice'
      body: |-
        We use percentile dice to determine success. The higher you roll the better. But it’s not quite as direct as all that. Our system is based on a concept called ‘The Ladder’. The Ladder is used to determine how much you succeeded or failed by. <a href="/wiki/ladder" target="_blank">Check out the Ladder here.</a>



        The line on the left represents the might. The line on the right represents the difficulty of the task. If you draw a straight line from the might to the difficulty, then where the line crosses the diagonal is the roll needed on your dice.

        All of this is handled on our site by the in-site ruler because this is a little complicated to do by hand. You’ll see the in-site ruler in each chat room just above the posting area. While the actual math involves trigonometry, there are some guidelines that will let you eyeball it:

        If your character's might is equal to the difficulty, you have a 50% chance to succeed.
        If your character's might is double the difficulty, you have an 80% chance to succeed.
        If your character's might is half the difficulty, you have a 17% chance to succeed.

        Your might is the base value for doing anything here so you always want to have a high one if you can. But there is a point of diminishing returns where a higher might isn’t going to gain you a lot more. That’s usually around a 140 might - so at that point, consider spending your points in a new skill.

        You'll notice most of the time the values will come out to some kind of fraction. But that doesn't really help us in a session when we want to say how many hit points your character just lost. We use natural rounding here - so 4.4 is read as a 4, and 4.5 is read as a 5.

        [b]Question:[/b]

        If the difficulty of your task is a 25, what might do you need to have at least an 80% chance of success?
