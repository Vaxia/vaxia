      title: 'Social walkthrough - Pushing boundaries'
      body: |-
        Roleplaying can push many boundaries on occasion, but the question always is how far is too far? There is no easy answer to this as different people have placed the line in different places. This site, however, is about promoting fun as well as being a safe place to come and play. We have already covered respecting each other’s boundaries as different people have their too far line in different places - but there are some things that should be avoid all together in character - and more importantly - OUT of character.

        Start with the <a href="/wiki/code-conduct" target="_blank">Code of Conduct</a> and the site <a href="/wiki/harassment-policy" target="_blank">Harassment Policy<a>, those pages will let you know  if certain scenes and topics are not acceptable for roleplay on the site. The second thing you can do is ask yourself - how far is too far? If you are unsure, before you post anything seek out an A/SH and talk to them. After talking to an A/SH make sure to clear it with your fellow players as well.

