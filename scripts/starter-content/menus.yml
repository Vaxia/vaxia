# The site's menus, read by scripts/starter-content.php: the original VAXIA
# sidebar menus with links to this release's pages. Menu blocks show only to
# the roles their block allows, and Drupal hides any link a visitor can't
# open, so staff links can sit beside player links.
#
# Each menu (by machine name): a list of links with title, weight and one of
#   path: an internal path or alias ("/" is the front page),
#   forum: a forum, by its path in the forum list (parent / child),
#   heading: true, a label for the links under it (children),
#   per_realm: a path with {realm} (the realm in lower case with dashes);
#     the title's {realm} is the realm's name. One link per playable realm.
# Re-running the script adds missing links only (matched by menu, parent and
# title).

menus:
  main:
    - {title: Home, path: /, weight: -50}
    - {title: Forums, path: /forum, weight: -49}
    - {title: Calendar, path: /calendar, weight: -48}
