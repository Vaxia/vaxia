eval:
  title: 'Content Evaluation Exam'
  body: |-
    The Content Evaluation exam is to prepare you for evaluation of characters and items.  It will help assess your readiness to spot problematic elements and communicate well with the original submitter to help move toward an agreeable solution.  Becoming an evaluator is a non-optional component of being an SH.  You may begin this exam at any point after successfully passing ASH Test 2 on Ruling.

    Before starting this exam, please review [url=/wiki/evaluators]the Character Evaluation Guide[/url] in the wiki, as well as the [url=/wiki/system-rules/items-and-equipment]Items and Equipment Rules[/url].  

    NOTE:  You'll be able to use both pages as reference during this test and when you're actually evaluating items and characters, so there's no need to memorize the information (since there's quite a lot of it), but it may be a good idea to familiarize yourself with the basic concepts of each before proceeded.

    Like all the other ASH Tests, this test is not meant to be something you ace the first time through!  After you've completed the test, review any questions you got wrong and you should see feedback to help guide you to the right answer.  If you have any questions, contact the System Leads, we're happy to help with any questions you may have :)
