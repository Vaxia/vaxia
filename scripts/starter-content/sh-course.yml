ash2_renewal:
  title: 'ASH Test 2 - Renewing SHs'
  body: |-
    Welcome to your SH renewal exam!  This is your annual refresher on the numbers system, incorporating any new changes and making sure we're all relatively on the same page in terms of ruling.

    First, review Ruling section of the SH Course.  Then, when you feel ready, proceed with the exam. If you are returning from an absence, we also recommend reviewing the Recent System Changes and the SH Reference Guide to get yourself up to date on new features or changes you may have missed.

    Please understand that this exam is not strictly pass/fail - you can reattempt it until you feel you understand the material, and there will be helpful feedback to explain any answers that you get wrong.  The goal is for you to understand the system by the time you're done, even if you don't understand it perfectly when you start.

    [b]NOTE:[/b] You MAY (and probably should) use the on-site dice ruler for this exam!  The goal isn't to test your math skills, just your understanding of what to plug in where and how to narrate it back to the players :)  You're welcome to rule by the Ladder if you feel more comfortable with it, but it may be worthwhile to learn to use the Dice Ruler as it can speed response times in actual sessions.

    Good luck!
