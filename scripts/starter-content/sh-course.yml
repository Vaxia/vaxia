# The storyhost (SH) course quizzes, read by scripts/starter-content.php: the
# original VAXIA course (ASH Test 1, 2, the renewal test, the content
# evaluation exam and the final exam) with the example realms in place.
# The exam's item questions use the site's own item worth (the Items and
# Equipment page, as the item form calculates it; ItemsTest checks them).
# Each question: type (multichoice or long_answer), title, body (BBCode,
# wiki format), max_score, and for multiple choice: multi, random, boolean
# and answers (answer text, score if chosen, score if not chosen).
# Long answers are graded by hand (Results > Grade).

ash1:
  title: 'ASH Test 1 - Story Hosting Basics'
  body: |-
    Welcome to the start of your SH exam.  Before attempting this quiz, we recommend reading the [url=/wiki/story-hosting-basics]Story Hosting Basics[/url] section of the wiki to make sure you're familiar with the latest policies and philosophies of being an SH here.  

    When you are ready, proceed with the exam.  After you complete the exam, you will need to run at least 3 sessions before you can begin Test 2.  Since we haven't yet covered rulings, you will need to have another SH rule the numbers for you.  It does not need to be the same SH for all three sessions, any SH will do.  They are to act as your mentor, so ask them any questions you need to get yourself comfortable with setting the scene and narrating what's happening IC.

    Good luck!
