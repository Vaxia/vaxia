ash2:
  title: 'ASH Test 2 - Ruling'
  body: |-
    Welcome to your second SH exam!  By now, you have run at least a few sessions and have a feel for what being an SH is like.  The next step is ruling your own numbers and understanding the game system :)

    First, review the SH Course pages on Ruling.  Then, when you feel ready, proceed with the exam. 

    Please understand that this exam is not strictly pass/fail - you can reattempt it until you feel you understand the material, and there will be helpful feedback to explain any answers that you get wrong.  The goal is for you to understand the system by the time you're done, even if you don't understand it perfectly when you start.

    [b]NOTE:[/b] You MAY (and probably should) use Dice Ruler for this exam!  The goal isn't to test your math skills, just your understanding of what to plug in where and how to narrate it back to the players :)  You're welcome to rule by the Ladder if you feel more comfortable with it, but it may be worthwhile to learn to use the Dice Ruler as it can speed response times in actual sessions.

    After you complete the exam, you will need to run at least 5 sessions before you can begin the final exam to become a full SH.  The last exam is entirely open-ended and will be reviewed by your fellow SHs for approval.

    Good luck!
  pass_rate: 90
  randomize: false
  takes: 0
  allow_skipping: false
  summary_pass: ''
  summary_default: ''
  questions:
    -
      type: multichoice
      title: 'Case 1 - Difficulty'
      body: |-
        [b]Case 1 - Single-Trait Ruling[/b]
        [i]Your Narrative:[/i] "In the newly fallen snow, the night air seems crisp. You four have been called to help capture the dreaded wendigo that has been terrorizing these woods for weeks.  You reach the forest’s edge, and all seems still except for the distant, sporadic cracking of the ice-laden branches of trees.

        Actions?"

        [i]Player 1 (Daedlus):[/i] "Daedlus scours the earth like a nearsighted hawk. This hunt is no simple trip, he feels something momentus will occur, some magical feeling within him that says "this isn't your everyday wendigo hunt." He watches, peering into the dark with his elven eyes, and waiting for some sign of something large, white and furry."

        [b](1d100) + awa (25) + Forest Scouting (35) => Might: 60, Roll: 37[/b]

        [b]Question 1[/b] - What difficulty would you set for the Awareness check?
