template_code: "{% set opt = tag.option|trim %}{% set src = ('' ~ tag.source)|trim %}{% set href = opt ?: src %}{% if href matches '{^www[.]}i' %}{% set href = 'http://' ~ href %}{% endif %}{% if href matches '{^[A-Za-z0-9_:;&,~%+!=@/.#?-]+$}' and (href matches '{^(https?|ftp|mailto):}i' or not (href matches '{^[^/?#]*:}')) %}<a href=\"{{ href }}\" class=\"bb-url\" rel=\"nofollow\">{% if opt %}{{ tag.content }}{% else %}{{ src }}{% endif %}</a>{% else %}{{ tag.outerSource }}{% endif %}"
