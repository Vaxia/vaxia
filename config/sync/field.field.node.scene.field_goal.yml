description: "<b>Let us know what you're looking for with this scene!</b><br>\r\nIf you're looking for silver, need an item ruled, or want to gain reputation select the goal to match. If you are submitting a scene as evidence of maintaining a character or other situation, for example, vampiric feeding or other \"Maintenance required\" conditions, select maintenance as your goal. If you're looking to setup a character save point if your character encounters a death situation, select that. If you're not sure, leave this as 'generic' and explain in the notes."
